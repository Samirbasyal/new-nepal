<!--
  ========================================
  ORGANIZATION LOGO - VERSION FOR DARK BACKGROUNDS
  ========================================
  Same placeholder mark, but with a light background shape so it stays
  visible on the dark green footer and the login pages.

  Replace this file with your own light version, or open config/site.ts and
  set  srcOnDark: ''  to use the normal logo everywhere.
  ========================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Janakalyan Samataa Yuwa Club logo">
  <defs>
    <linearGradient id="jsycBrandDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7F0E9"/>
    </linearGradient>
    <linearGradient id="jsycSunDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8BE52"/>
      <stop offset="100%" stop-color="#E4880B"/>
    </linearGradient>
  </defs>

  <!-- Shield in light colour so it stands out on the dark green footer -->
  <path d="M32 3 L56 12 V31 C56 45 45.5 55.5 32 61 C18.5 55.5 8 45 8 31 V12 Z" fill="url(#jsycBrandDark)"/>

  <circle cx="32" cy="24" r="7" fill="url(#jsycSunDark)"/>

  <circle cx="25" cy="38" r="4" fill="#115C53"/>
  <path d="M18 52 C18 45.5 21 42.5 25 42.5 C29 42.5 32 45.5 32 52 Z" fill="#115C53"/>

  <circle cx="39" cy="38" r="4" fill="#239382"/>
  <path d="M32 52 C32 45.5 35 42.5 39 42.5 C43 42.5 46 45.5 46 52 Z" fill="#239382"/>
</svg>
